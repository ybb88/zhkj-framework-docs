# ==============================================================================
# ZHKJ Framework 官方文档中心 Nginx 部署配置模板
# ==============================================================================

server {
    listen       80;
    server_name  docs.zhkj.internal; # 替换为您的内网域名或对外域名/IP

    # 1. 指向 docs 目录绝对路径 (Linux 服务器路径示例)
    root /data/www/zhkj-framework/docs;
    index index.html;

    # 2. 开启 Gzip 压缩，显著降低带宽消耗并极大加快 Markdown 传输渲染速度
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json text/xml text/javascript image/svg+xml text/markdown;
    gzip_vary on;

    # 3. 核心单页路由回退保障
    location / {
        # 如果请求的静态资源（.md、.png、.css 等）不存在，回退给 index.html 动态处理
        try_files $uri $uri/ /index.html;
    }

    # 4. Markdown 与静态文本文件缓存控制（保证文档更新后用户刷新即看到最新内容）
    location ~* \.(md|txt)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 5. 图片与媒体资源客户端缓存
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 6. 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 7. 日志配置
    access_log /var/log/nginx/zhkj_docs_access.log;
    error_log  /var/log/nginx/zhkj_docs_error.log;
}
