<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ZHKJ Framework 官方文档中心</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="ZHKJ Framework 企业级微服务技术底座官方文档中心">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- 官方 Vue 风格主题 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- 暗黑主题切换支持 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">
  <style>
    :root {
      --theme-color: #1890ff;
      --docsifytabs-border-color: #ededed;
      --docsifytabs-tab-highlight-color: #1890ff;
    }
    .app-name-link {
      font-weight: 700;
      font-size: 18px;
    }
    .sidebar {
      font-size: 14.5px;
    }
    .sidebar ul li a {
      color: #333;
      font-weight: 400;
    }
    .sidebar ul li.active > a {
      color: var(--theme-color);
      font-weight: 600;
    }
    .markdown-section pre > code {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, Monaco, monospace;
      font-size: 13.5px;
    }
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color);
      background-color: rgba(24, 144, 255, 0.05);
      border-radius: 0 4px 4px 0;
      padding: 12px 16px;
    }
  </style>
</head>
<body>
  <div id="app">正在加载 ZHKJ Framework 文档中心...</div>
  <script>
    window.$docsify = {
      name: 'ZHKJ Framework',
      nameLink: '#/',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      notFoundPage: true,
      
      // 全文搜索配置
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索核心架构、规范、配置字典...',
        noData: '未找到匹配内容',
        depth: 4
      },

      // 代码复制插件
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },

      // 分页导航
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true
      },

      // 字数与阅读时长统计
      count: {
        countable: true,
        fontsize: '0.9em',
        color: 'rgb(90,90,90)',
        language: 'chinese'
      }
    }
  </script>
  <!-- Docsify 核心脚本 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- 全文搜索插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- 代码复制插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- 图片放大插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <!-- 上下一篇分页插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- 字数统计插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-count/dist/countable.min.js"></script>
  <!-- 暗黑主题切换插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>

  <!-- PrismJS 核心语言高亮支持 -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-properties.min.js"></script>
</body>
</html>
